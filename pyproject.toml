[equires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6.0",
    "opencv-python>=4.8.0",
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "pyinstaller>=6.0.0",
    "pyinstaller-hooks-contrib>=2024.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
